<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>농산물 유통업자 — 소개</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <span class="nav__logo">농산물유통</span>
    <nav class="nav__links">
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero">
      <p class="hero__eyebrow">안녕하세요</p>
      <h1 class="hero__name">믿을 수 있는 농산물 유통업자입니다</h1>
      <p class="hero__tagline">산지에서 소비자의 식탁까지, 신선함을 그대로 전달합니다.</p>
      <a class="hero__cta" href="#contact">문의하기</a>
    </section>

    <section class="about" id="about">
      <h2 class="section__title">About</h2>
      <p class="about__text">
        다년간 농산물 유통업에 종사하며 산지와 직접 거래해 신선하고 믿을 수 있는
        농산물을 합리적인 가격에 공급하고 있습니다. 계절별 제철 농산물부터
        안정적인 대량 공급까지, 신뢰를 최우선으로 생각합니다.
      </p>
    </section>

    <section class="contact" id="contact">
      <h2 class="section__title">Contact</h2>
      <ul class="contact__list">
        <li>
          <a href="mailto:kyh7443@gmail.com">
            <span class="contact__label">이메일</span>
            <span class="contact__value">kyh7443@gmail.com</span>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> 농산물유통. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
